# Dev: `docker compose watch` (build + start + live-sync on file changes)
# Prod: `docker compose up -d` (develop.watch is ignored)
x-watch: &watch
  - action: sync            # frontend files are read from disk per request: no restart needed
    path: ./statking/web/static
    target: /app/statking/web/static
  - action: sync+restart    # python code: copy, then restart the container
    path: ./statking
    target: /app/statking
    ignore:
      - web/static/
      - __pycache__/
      - "*.pyc"
  - action: rebuild         # dependencies / image definition changed
    path: ./requirements.txt
  - action: rebuild
    path: ./Dockerfile

services:
  collector:
    build: .
    restart: unless-stopped
    environment:
      # per-job intervals in hours (defaults shown); last run is persisted, restarts don't re-scrape
      RENT_INTERVAL_HOURS: 24
      # cities from statking/cities.py (default: all). Every extra city multiplies requests to WG-Gesucht - keep it modest.
      RENT_CITIES: "kiel,hamburg,berlin,muenchen,koeln,frankfurt,leipzig,hannover"
      RENT_MAX_PAGES: 10        # pages per city/category (~20 listings each); big cities are therefore a sample
      RENT_PAUSE_SECONDS: 45    # pause between city/category crawls
      STEAM_INTERVAL_HOURS: 0.25
      WEATHER_INTERVAL_HOURS: 12
      WIKI_INTERVAL_HOURS: 24
      CHESS_INTERVAL_HOURS: 6
      STAT_INTERVAL_HOURS: 168
      WIKI_ARTICLES: "de:Weihnachtsmann,de:Trennung"
      CHESSCOM_USER: ${CHESSCOM_USER:-}   # set in .env to enable chess tracking
    volumes:
      - ./data:/data
    develop:
      watch: *watch
  web:
    build: .
    command: ["python", "-m", "statking", "serve"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    develop:
      watch: *watch
